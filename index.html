<!DOCTYPE html>
<html lang="ja" data-ui="pc">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-title" content="HycarPerd">
  <title>HycarPerd</title>
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <header id="menubar" class="menubar"></header>

  <main class="workspace">
    <div class="card-column">
      <div id="card-area" class="card-area">
        <section id="card-window" class="card-window" aria-label="カード">
          <div class="title-bar"><span id="card-name">読み込み中...</span></div>
          <div id="card-stage" class="card-stage"></div>
        </section>
        <div id="paint-palette" class="paint-palette" aria-label="描画の道具" hidden></div>
      </div>
      <p id="message-box" class="message-box" aria-label="メッセージボックス" hidden></p>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="stack-file" class="visually-hidden" type="file" accept=".json,application/json"
    tabindex="-1" aria-hidden="true">
  <input id="image-file" class="visually-hidden" type="file" accept="image/*"
    tabindex="-1" aria-hidden="true">
</body>
</html>
